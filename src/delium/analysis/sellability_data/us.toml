# Sellability weights — ABSOLUTE scale, EXTERNAL DATA (not batch-relative).
#
# ⚠️ ILLUSTRATIVE until calibrated against real launch outcomes. Bump `version`.
#
# Sellability answers "if I launched this tomorrow, would it sell?" WITHOUT
# double-counting anything the opportunity score already prices. It combines:
#   * opportunity      — the full 5-pillar opportunity score (demand, competition,
#                        differentiation, PROFITABILITY, risk). Counts all of
#                        those exactly once.
#   * price_headroom   — room at MY target price (launchability's price-crowding
#                        component). The opportunity score is price-agnostic to my
#                        specific entry price, so this is genuinely new.
#   * incumbent_freshness — how young/movable the page-one incumbents are
#                        (launchability's listing-age component). Not used by any
#                        opportunity pillar.
#   * product_momentum — the CANDIDATE'S OWN review-accrual velocity (new
#                        reviews/month). No pillar uses it: competition C3 measures
#                        the *leaders'* review velocity (a threat), demand D2/D3 are
#                        cluster medians, and the candidate's own BSR slope is left
#                        out on purpose (D3 prices cluster trend and the emergence
#                        signal already surfaces own-rank momentum separately). See
#                        docs/sellability.md.
#
# The overlapping launchability parts (review moat, heavy-review count, brand
# presence, listing-quality gap) are DELIBERATELY EXCLUDED here — the competition
# pillar inside `opportunity` already prices them. Profitability is inside
# `opportunity` and is never re-added.
#
# Score = weighted mean over the AVAILABLE components (missing → renormalize, same
# rule as the composite). Confidence is a SEPARATE badge, never folded in.

version = "us-2026"

[weights]
opportunity = 55           # the vetted 5-pillar score carries most of the weight
price_headroom = 22        # non-overlapping: headroom at my target price
incumbent_freshness = 13   # non-overlapping: how movable the incumbents are
product_momentum = 10      # non-overlapping: the candidate's own review velocity

# product_momentum maps the candidate's OWN new-reviews/month to 0-100 (absolute).
# <= lo reviews/mo → 0 (no traction), >= hi → 100 (selling hard). Log-scaled.
[product_momentum]
reviews_per_month_lo = 1
reviews_per_month_hi = 120
